services:
  api:
    build:
      context: .
      args:
        TARGET: api
    container_name: payment_api
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - redis
      - queue
      - ws
    command: ["/bin/transaction-monitoring-and-fraud-detection-poc"]
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        TARGET: worker
    container_name: payment_worker
    env_file:
      - .env
    depends_on:
      - queue
      - redis
    command: ["/bin/transaction-monitoring-and-fraud-detection-poc"]
    restart: unless-stopped

  ws:
    build:
      context: .
      args:
        TARGET: ws-gateway
    container_name: websocket_gateway
    ports:
      - "9000:9000"
    env_file:
      - .env
    depends_on:
      - redis
    command: ["/bin/transaction-monitoring-and-fraud-detection-poc"]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB:       ${POSTGRES_DB:-fraud_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d fraud_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    depends_on:
      db:
        condition: service_healthy
    command:
      - -path=/migrations/
      - -database=${DATABASE_URL}
      - up

  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_AUTH}
    command: ["redis-server", "--requirepass", "$${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis:/var/lib/redis/data

  queue:
    image: bodsch/docker-beanstalkd:1.10
    container_name: beanstalkd
    restart: unless-stopped
    ports:
      - "11300:11300"

  beanstalkd-ui:
    image: thedavis/beanstalkd-ui:0.0.2
    container_name: beanstalkd_ui
    depends_on:
      - queue
    environment:
      - BEANSTALKD_HOST=queue
      - BEANSTALKD_PORT=11300
    ports:
      - "8902:80"

volumes:
  redis:
    driver: local
